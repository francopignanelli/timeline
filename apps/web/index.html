<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Timelines</title>
    <script>
      // Applied here, before any CSS paints, so there's no flash of the wrong
      // theme — the same logic lives in src/lib/theme.ts for the toggle to
      // reuse after mount. Dark is the product default for a first-time
      // visitor (not a prefers-color-scheme fallback) — keep this in sync
      // with DEFAULT_THEME there if that ever changes.
      (function () {
        try {
          var stored = localStorage.getItem('timeline.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // Ignore — falls back to the light palette defined on :root.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
